[build-system]
requires = ["maturin>=1.9.6,<2.0"]
build-backend = "maturin"

[project]
name = "uzru-parser"
version = "0.1.0-rc4"
description = "CPU-first document parser and chunker for Russian and Uzbek documents (RAG-ready)."
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0 AND Apache-2.0 AND BSD-3-Clause AND Unicode-3.0"
license-files = ["LICENSE", "THIRD_PARTY.md", "LICENSES/*", "src/data/LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Khayitboy Khayitov" }]
maintainers = [{ name = "Khayitboy Khayitov" }]
dependencies = ["python-docx>=1.1"]
keywords = ["parser", "rag", "chunking", "pdf", "docx", "russian", "uzbek", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Russian",
]

[project.urls]
Homepage = "https://github.com/KhayitovDev/uzru-parser"
Repository = "https://github.com/KhayitovDev/uzru-parser"
Issues = "https://github.com/KhayitovDev/uzru-parser/issues"
Changelog = "https://github.com/KhayitovDev/uzru-parser/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
layout = ["pymupdf>=1.24", "onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "maturin>=1.9.6,<2.0", "pymupdf>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "uzru_parser._core"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["python"]

[[tool.mypy.overrides]]
# The optional layout model's runtime (ONNX Runtime, which brings NumPy): absent without the
# "layout" extra.
module = ["onnxruntime", "onnxruntime.*", "numpy", "numpy.*"]
ignore_missing_imports = true
