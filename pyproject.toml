[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "uzru-parser"
version = "0.1.0"
description = "CPU-first document parser and chunker for Russian and Uzbek documents (RAG-ready)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "python-docx>=1.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Natural Language :: Uzbek",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "maturin>=1.7,<2.0"]

[tool.maturin]
python-source = "python"
module-name = "uzru_parser._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["python"]
