name: Release

# Builds and tests every wheel and the sdist, then publishes with PyPI Trusted Publishing
# (no API tokens). Tags vX.Y.ZrcN and manual runs go to TestPyPI, final tags vX.Y.Z to PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, runner: macos-14, target: aarch64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-wheels:
    name: test ${{ matrix.name }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-14 }
          - { name: windows-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - name: Bare install (no PDF extra) imports and parses DOCX
        shell: bash
        run: |
          python -m venv bare
          if [ -d bare/Scripts ]; then BIN=bare/Scripts; else BIN=bare/bin; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" tests/smoke_bare.py
      - name: Full test suite with the PDF extra
        shell: bash
        run: |
          python -m venv full
          if [ -d full/Scripts ]; then BIN=full/Scripts; else BIN=full/bin; fi
          WHEEL=$(ls dist/*.whl)
          "$BIN/python" -m pip install "${WHEEL}[pdf]" pytest
          "$BIN/python" -m pytest tests

  test-musllinux:
    needs: wheels
    runs-on: ubuntu-latest
    container: python:3.12-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-musllinux-x86_64
          path: dist
      - name: Install the C++ runtime PyMuPDF's musl wheel needs
        run: apk add --no-cache libstdc++
      - name: Bare install and full test suite
        run: |
          python -m venv /tmp/bare && /tmp/bare/bin/pip install dist/*.whl
          /tmp/bare/bin/python tests/smoke_bare.py
          python -m venv /tmp/full && /tmp/full/bin/pip install --only-binary=:all: "$(ls dist/*.whl)[pdf]" pytest
          /tmp/full/bin/python -m pytest tests

  check:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python -m pip install twine
      - run: twine check --strict dist/*

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'rc')
    needs: [check, test-wheels, test-musllinux]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/uzru-parser
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Release candidates share the package version: keep files already uploaded.
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    needs: [check, test-wheels, test-musllinux]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uzru-parser
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
